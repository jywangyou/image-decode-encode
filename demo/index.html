<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>图片隐写术 - 在线演示</title>
  <link rel="icon" href="/demo/img/logo.png" size="any">
  <link rel="stylesheet" href="/demo/demo.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="#" class="logo">
        <img src="/demo/img/logo.png" alt="logo" class="logo-img">
        <span class="logo-text">隐写术</span>
      </a>
      <a href="https://github.com/jywangyou/image-decode-encode" class="github-link" target="_blank" aria-label="GitHub">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>图片隐写术在线演示</h1>
      <p>将秘密信息隐藏到图片中，不影响图片显示，支持密码加密保护</p>
    </section>

    <div class="tabs">
      <button class="tab-btn active" data-tab="encode">加密隐藏</button>
      <button class="tab-btn" data-tab="decode">解密提取</button>
    </div>

    <section id="encode-panel" class="panel active">
      <div class="panel-body">
        <div class="form-group">
          <label class="form-label">1. 选择一张用于隐藏信息的图片</label>
          <p class="form-hint">建议使用 PNG 格式，图片越大可隐藏的信息越多。</p>
          <div class="drop-zone" id="encode-drop-zone">
            <svg class="drop-zone-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <div class="drop-zone-text">点击选择图片，或拖拽到此处</div>
            <div class="drop-zone-hint">支持 PNG、JPG、WebP</div>
          </div>
          <input type="file" accept="image/*" class="file-input" id="encode-file">
          <div class="preview-container" id="encode-preview" style="display:none">
            <img class="preview-img" id="encode-preview-img" alt="预览">
            <div class="preview-info">
              <p id="encode-img-info"></p>
              <div class="capacity-bar"><div class="capacity-bar-fill" id="encode-capacity-fill"></div></div>
              <div class="capacity-text" id="encode-capacity-text"></div>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">2. 输入要隐藏的文字信息</label>
          <textarea class="textarea" id="encode-message" rows="4" placeholder="输入要隐藏到图片中的秘密文字，例如：I love you，我爱你"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">
            3. 设置加密密码
            <span class="label-tag" id="encode-pwd-tag">可选</span>
          </label>
          <p class="form-hint">不设置密码则任何人可以直接提取信息。</p>
          <div class="toggle-row">
            <label class="toggle-switch">
              <input type="checkbox" id="encode-pwd-toggle">
              <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label" id="encode-pwd-toggle-label">不使用密码</span>
          </div>
          <input type="password" class="input" id="encode-password" placeholder="请设置加密密码" style="display:none">
        </div>

        <button class="btn btn-primary btn-block" id="encode-btn">
          <span class="spinner"></span>
          <span class="btn-text">生成带隐藏信息的图片</span>
        </button>

        <div class="alert alert-error" id="encode-error">
          <span class="alert-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          </span>
          <div class="alert-content" id="encode-error-text"></div>
        </div>

        <div id="encode-result" style="display:none">
          <div class="alert alert-success show">
            <span class="alert-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </span>
            <div class="alert-content">带有加密信息的图片已生成！点击下方图片即可保存。</div>
          </div>
          <div class="result-image-wrapper">
            <img class="result-image" id="encode-result-img" alt="结果图片">
            <p class="result-hint">点击图片下载保存</p>
          </div>
        </div>
      </div>
    </section>

    <section id="decode-panel" class="panel">
      <div class="panel-body">
        <div class="form-group">
          <label class="form-label">1. 选择一张带有隐藏信息的图片</label>
          <p class="form-hint">上传通过本工具加密过的图片。</p>
          <div class="drop-zone" id="decode-drop-zone">
            <svg class="drop-zone-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <div class="drop-zone-text">点击选择图片，或拖拽到此处</div>
            <div class="drop-zone-hint">支持 PNG、JPG、WebP</div>
          </div>
          <input type="file" accept="image/*" class="file-input" id="decode-file">
          <div class="preview-container" id="decode-preview" style="display:none">
            <img class="preview-img" id="decode-preview-img" alt="预览">
            <div class="preview-info">
              <p id="decode-img-info"></p>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">
            2. 输入解密密码
            <span class="label-tag" id="decode-pwd-tag">可选</span>
          </label>
          <div class="toggle-row">
            <label class="toggle-switch">
              <input type="checkbox" id="decode-pwd-toggle">
              <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label" id="decode-pwd-toggle-label">不使用密码</span>
          </div>
          <input type="password" class="input" id="decode-password" placeholder="请输入加密时使用的密码" style="display:none">
        </div>

        <button class="btn btn-primary btn-block" id="decode-btn">
          <span class="spinner"></span>
          <span class="btn-text">解密出隐藏的信息</span>
        </button>

        <div class="alert alert-error" id="decode-error">
          <span class="alert-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          </span>
          <div class="alert-content" id="decode-error-text"></div>
        </div>

        <div class="alert alert-success" id="decode-success">
          <span class="alert-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </span>
          <div class="alert-content" id="decode-success-text"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    Image Steganography Library v1.0.0 &middot;
    <a href="https://github.com/jywangyou/image-decode-encode" target="_blank">GitHub</a>
  </footer>

  <script src="../lib/sjcl.js"></script>
  <script src="../src/steganography.js"></script>
  <script src="/demo/demo.js"></script>
</body>
</html>
