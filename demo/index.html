<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片隐写术 - 在线演示</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="#" class="logo">
        <div class="logo-icon">隐</div>
        <span class="logo-text">图片隐写术</span>
      </a>
      <div class="nav-links">
        <a href="https://github.com/jywangyou/image-decode-encode" class="nav-link" target="_blank">GitHub</a>
      </div>
    </div>
  </header>

  <main>
    <div class="page-title">
      <h1>图片隐写术在线演示</h1>
      <p>将秘密信息隐藏到图片中，不影响图片显示，支持密码加密保护</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="encode">加密隐藏</button>
      <button class="tab-btn" data-tab="decode">解密提取</button>
    </div>

    <div id="encode-panel" class="panel active">
      <div class="panel-body">
        <div class="form-group">
          <label class="form-label">1. 选择一张用于隐藏信息的图片</label>
          <div class="form-hint">建议使用 PNG 格式，图片越大可隐藏的信息越多。</div>
          <div class="drop-zone" id="encode-drop-zone">
            <div class="drop-zone-icon">📁</div>
            <div class="drop-zone-text">点击此处选择图片，或将图片拖拽到此处</div>
            <div class="drop-zone-hint">支持 PNG、JPG、WebP 格式</div>
          </div>
          <input type="file" accept="image/*" class="file-input" id="encode-file">
          <div class="preview-container" id="encode-preview" style="display:none">
            <img class="preview-img" id="encode-preview-img">
            <div class="preview-info">
              <p id="encode-img-info"></p>
              <div class="capacity-bar"><div class="capacity-bar-fill" id="encode-capacity-fill"></div></div>
              <div class="capacity-text" id="encode-capacity-text"></div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <label class="form-label">2. 输入要隐藏的文字信息</label>
          <textarea class="textarea" id="encode-message" rows="5" placeholder="输入要隐藏到图片中的秘密文字，例如：I love you，我爱你"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">
            3. 设置加密密码
            <span class="label-tag" id="encode-pwd-tag">可选</span>
          </label>
          <div class="form-hint">不设置密码则任何人可以直接提取信息，设置密码后解密时需输入相同密码。</div>
          <div class="toggle-row">
            <label class="toggle-switch">
              <input type="checkbox" id="encode-pwd-toggle">
              <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label" id="encode-pwd-toggle-label">不使用密码</span>
          </div>
          <input type="password" class="input" id="encode-password" placeholder="请设置加密密码" style="display:none">
        </div>

        <button class="btn btn-primary btn-lg btn-block" id="encode-btn">
          <span class="spinner"></span>
          <span class="btn-text">生成带隐藏信息的图片</span>
        </button>

        <div class="alert alert-error" id="encode-error">
          <span class="alert-icon">✕</span>
          <div class="alert-content" id="encode-error-text"></div>
        </div>

        <div id="encode-result" style="display:none">
          <div class="divider"></div>
          <div class="alert alert-success show">
            <span class="alert-icon">✓</span>
            <div class="alert-content">
              带有加密信息的图片已生成！点击下方图片即可保存。
            </div>
          </div>
          <div class="result-image-wrapper">
            <img class="result-image" id="encode-result-img">
            <div class="result-hint">点击图片下载保存</div>
          </div>
        </div>
      </div>
    </div>

    <div id="decode-panel" class="panel">
      <div class="panel-body">
        <div class="form-group">
          <label class="form-label">1. 选择一张带有隐藏信息的图片</label>
          <div class="form-hint">上传通过本工具加密过的图片。</div>
          <div class="drop-zone" id="decode-drop-zone">
            <div class="drop-zone-icon">📁</div>
            <div class="drop-zone-text">点击此处选择图片，或将图片拖拽到此处</div>
            <div class="drop-zone-hint">支持 PNG、JPG、WebP 格式</div>
          </div>
          <input type="file" accept="image/*" class="file-input" id="decode-file">
          <div class="preview-container" id="decode-preview" style="display:none">
            <img class="preview-img" id="decode-preview-img">
            <div class="preview-info">
              <p id="decode-img-info"></p>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <label class="form-label">
            2. 输入解密密码
            <span class="label-tag" id="decode-pwd-tag">可选</span>
          </label>
          <div class="toggle-row">
            <label class="toggle-switch">
              <input type="checkbox" id="decode-pwd-toggle">
              <span class="toggle-slider"></span>
            </label>
            <span class="toggle-label" id="decode-pwd-toggle-label">不使用密码</span>
          </div>
          <input type="password" class="input" id="decode-password" placeholder="请输入加密时使用的密码" style="display:none">
        </div>

        <button class="btn btn-primary btn-lg btn-block" id="decode-btn">
          <span class="spinner"></span>
          <span class="btn-text">解密出隐藏的信息</span>
        </button>

        <div class="alert alert-error" id="decode-error">
          <span class="alert-icon">✕</span>
          <div class="alert-content" id="decode-error-text"></div>
        </div>

        <div class="alert alert-success" id="decode-success">
          <span class="alert-icon">✓</span>
          <div class="alert-content" id="decode-success-text">
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    图片隐写术库 v1.0.0 &middot;
    <a href="https://github.com/jywangyou/image-decode-encode" target="_blank">查看 GitHub</a>
  </footer>

  <script src="../lib/sjcl.js"></script>
  <script src="../src/steganography.js"></script>
  <script src="./demo.js"></script>
</body>
</html>
